<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tic-tac-toe Lab</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <p id="challenge">coding challenge</p>
      <p>cookie 2</p>
      <h1 id="game-title">tic-tac-toe lab</h1>
      <section id="score-board">
        <div class="board">
          <p class="board-title">x</p>
          <p class="board-value">0</p>
        </div>
        <div class="board">
          <p class="board-title">rounds</p>
          <p class="board-value">0</p>
        </div>
        <div class="board">
          <p class="board-title">O</p>
          <p class="board-value">0</p>
        </div>
      </section>

      <p id="instruction">Player X starts. Each player gets 3 pieces.</p>
      <section id="box">
        <div class="row">
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
        </div>

        <div class="row">
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
        </div>
        <div class="row">
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
          <button class="mark-button">x</button>
        </div>
      </section>
      <div class="action">
        <button id="next-round">New round</button>
        <button id="delete">Reset score</button>
      </div>
    </main>
  </body>
</html>
